<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnePass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            serif: ["Source Serif 4", "Georgia", "serif"],
            display: ["EB Garamond", "Georgia", "serif"],
          },
          colors: {
            claude: { bg: "#F4F1EA", text: "#1a1a1a", muted: "#666666", accent: "#D97757", border: "#E0D8C8", surface: "#FFFFFF" },
            dark: { bg: "#1A1410", text: "#E8E0D4", muted: "#9A8E7A", accent: "#E8956D", border: "#352E26", surface: "#231E18" },
          },
        },
      },
    };
  </script>
  <style>
    body { background-color: #F4F1EA; color: #1a1a1a; font-family: 'Source Serif 4', serif; }
    .dark body { background-color: #1A1410; color: #E8E0D4; }
    
    /* Typography */
    .prose h1, .prose h2, .prose h3 { font-family: 'EB Garamond', serif; color: #1a1a1a; }
    .dark .prose h1, .dark .prose h2, .dark .prose h3 { color: #E8E0D4; }
    .prose h1 { font-size: 2.75rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.1; }
    .prose h2 { font-size: 1.75rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; border-top: 1px solid #1a1a1a; padding-top: 1rem; }
    .dark .prose h2 { border-color: #E8E0D4; }
    .prose h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    .prose p { font-size: 1.125rem; line-height: 1.7; margin-bottom: 1.25rem; }
    .prose ul, .prose ol { margin-bottom: 1.25rem; padding-left: 1.5rem; }
    .prose li { margin-bottom: 0.5rem; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #E5DFD5; }
    .dark ::-webkit-scrollbar-thumb { background: #352E26; }

    /* Layout specific */
    .sidebar-hidden #sidebar { display: none; }
    .editorial-border { border: 1px solid #1a1a1a; }
    .dark .editorial-border { border-color: #E8E0D4; }
  </style>
</head>
<body class="bg-claude-bg dark:bg-dark-bg font-serif text-claude-text dark:text-dark-text transition-colors duration-200">
  <div id="readingProgressBar" class="fixed top-0 left-0 h-1 bg-claude-accent z-50 transition-all duration-150 ease-out w-0"></div>
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div id="sidebar" class="w-80 flex flex-col bg-claude-bg dark:bg-dark-bg border-r border-claude-border dark:border-dark-border z-20 shrink-0">
      <div class="p-6 border-b border-claude-border dark:border-dark-border">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-3xl font-bold font-display uppercase tracking-widest">OnePass</h1>
          <button id="darkModeToggle" class="text-claude-muted hover:text-claude-text dark:hover:text-dark-text transition-colors">
            <svg id="moonIcon" class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            <svg id="sunIcon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
          </button>
        </div>
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Search lectures... (/)" class="w-full pb-2 bg-transparent border-b border-claude-border dark:border-dark-border text-sm font-sans placeholder-claude-muted focus:outline-none focus:border-claude-text dark:focus:border-dark-text transition-colors rounded-none" />
        </div>
      </div>
      <div id="lectureList" class="flex-1 overflow-y-auto p-4 space-y-1"></div>
      <div class="p-4 border-t border-claude-border dark:border-dark-border text-center">
        <span id="lectureCount" class="text-xs font-sans text-claude-muted tracking-widest uppercase">0 lectures</span>
      </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="flex-1 flex flex-col relative overflow-hidden bg-claude-bg dark:bg-dark-bg">
      <button id="sidebarToggle" class="absolute top-4 left-4 z-30 p-2 text-claude-muted hover:text-claude-text dark:hover:text-dark-text transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>

      <!-- Welcome Screen -->
      <div id="welcomeScreen" class="flex-1 flex flex-col items-center justify-center px-8 overflow-y-auto">
        <div class="max-w-2xl w-full text-center">
          <h2 class="text-6xl md:text-8xl font-bold font-display mb-6">OnePass</h2>
          <div class="h-px bg-claude-border dark:bg-dark-border w-24 mx-auto mb-6"></div>
          <p class="text-xl md:text-2xl font-serif text-claude-muted dark:text-dark-muted italic mb-12">Every lecture. Every detail. One pass.</p>
          <div id="welcomeBlockCards" class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left mb-12"></div>
          <p id="welcomeMessage" class="text-sm font-sans text-claude-muted uppercase tracking-widest">Loading lectures...</p>
        </div>
      </div>

      <!-- Lecture Content -->
      <div id="lectureContent" class="hidden flex-1 flex flex-col min-h-0 bg-claude-bg dark:bg-dark-bg">
        <div class="border-b border-claude-border dark:border-dark-border relative pt-12 pb-6 px-12 md:px-24 shrink-0">
          <button id="closeLecture" class="absolute top-6 right-6 p-2 text-claude-muted hover:text-claude-text dark:hover:text-dark-text transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
          <div class="mb-4 flex items-center gap-4 text-xs font-sans uppercase tracking-widest text-claude-muted">
            <span id="lectureModule"></span>
            <span id="readingTime"></span>
          </div>
          <h2 id="lectureTitle" class="text-4xl md:text-5xl font-bold font-display leading-tight mb-8"></h2>
          
          <div class="flex flex-wrap items-center gap-4" id="lectureActions">
            <button id="tocToggle" class="w-[180px] h-10 whitespace-nowrap justify-center text-xs font-sans uppercase tracking-widest border border-claude-border dark:border-dark-border hover:bg-claude-surface dark:hover:bg-dark-surface transition-colors flex items-center gap-2">
              Outline
            </button>
            <button id="pearlbookToggle" class="w-[180px] h-10 whitespace-nowrap justify-center text-xs font-sans uppercase tracking-widest border border-claude-border dark:border-dark-border hover:bg-claude-surface dark:hover:bg-dark-surface transition-colors flex items-center gap-2">
              Pearlbook
            </button>
            <button id="activeRecallToggle" onclick="toggleActiveRecall()" class="w-[180px] h-10 whitespace-nowrap justify-center text-xs font-sans uppercase tracking-widest border border-claude-border dark:border-dark-border hover:bg-claude-surface dark:hover:bg-dark-surface transition-colors flex items-center gap-2">
              <svg id="activeRecallIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              Active Recall
            </button>
            <button id="markCompleteBtn" class="w-[180px] h-10 whitespace-nowrap justify-center text-xs font-sans uppercase tracking-widest border border-claude-border dark:border-dark-border hover:bg-claude-surface dark:hover:bg-dark-surface transition-colors flex items-center gap-2">
              <svg id="markCompleteIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7" /></svg>
              <span id="markCompleteText">Complete</span>
            </button>
          </div>
        </div>

        <div class="flex border-b border-claude-border dark:border-dark-border px-12 md:px-24 overflow-x-auto shrink-0 hide-scrollbar">
          <button class="tab-btn py-4 pr-8 font-sans text-xs uppercase tracking-widest text-claude-muted border-b border-transparent data-[active=true]:border-claude-text data-[active=true]:text-claude-text dark:data-[active=true]:border-dark-text dark:data-[active=true]:text-dark-text hover:text-claude-text dark:hover:text-dark-text transition-colors" data-tab="summary">Summary</button>
          <button class="tab-btn py-4 px-8 font-sans text-xs uppercase tracking-widest text-claude-muted border-b border-transparent data-[active=true]:border-claude-text data-[active=true]:text-claude-text dark:data-[active=true]:border-dark-text dark:data-[active=true]:text-dark-text hover:text-claude-text dark:hover:text-dark-text transition-colors" data-tab="questions">Questions</button>
          <button class="tab-btn py-4 px-8 font-sans text-xs uppercase tracking-widest text-claude-muted border-b border-transparent data-[active=true]:border-claude-text data-[active=true]:text-claude-text dark:data-[active=true]:border-dark-text dark:data-[active=true]:text-dark-text hover:text-claude-text dark:hover:text-dark-text transition-colors" data-tab="flashcards">Flashcards</button>
          <button class="tab-btn py-4 px-8 font-sans text-xs uppercase tracking-widest text-claude-muted border-b border-transparent data-[active=true]:border-claude-text data-[active=true]:text-claude-text dark:data-[active=true]:border-dark-text dark:data-[active=true]:text-dark-text hover:text-claude-text dark:hover:text-dark-text transition-colors" data-tab="mindmap">Mind Map</button>
          <button class="tab-btn py-4 px-8 font-sans text-xs uppercase tracking-widest text-claude-muted border-b border-transparent data-[active=true]:border-claude-text data-[active=true]:text-claude-text dark:data-[active=true]:border-dark-text dark:data-[active=true]:text-dark-text hover:text-claude-text dark:hover:text-dark-text transition-colors" data-tab="anking">Anking</button>
          <button class="tab-btn py-4 pl-8 font-sans text-xs uppercase tracking-widest text-claude-muted border-b border-transparent data-[active=true]:border-claude-text data-[active=true]:text-claude-text dark:data-[active=true]:border-dark-text dark:data-[active=true]:text-dark-text hover:text-claude-text dark:hover:text-dark-text transition-colors" data-tab="high-yield">High Yield</button>
        </div>

        <div id="contentScroll" class="flex-1 overflow-y-auto">
          <div class="flex max-w-[1400px] mx-auto">
            <div id="tableOfContents" class="hidden w-64 border-r border-claude-border dark:border-dark-border p-8 sticky top-0 h-full overflow-y-auto font-sans text-sm hidden lg:block"></div>
            <div id="tabContent" class="flex-1 p-8 md:p-16 prose max-w-[900px] mx-auto"></div>
          </div>
        </div>
      </div>
      
      <button id="backToTop" class="fixed bottom-8 right-8 p-3 rounded-full border border-claude-border bg-claude-bg text-claude-text opacity-0 pointer-events-none transition-opacity duration-300">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
      </button>
    </div>
  </div>

  <div id="imageLightbox" class="fixed inset-0 z-50 hidden bg-claude-bg/95 dark:bg-dark-bg/95 backdrop-blur-sm opacity-0 transition-opacity" tabindex="-1">
    <div class="absolute top-6 right-6 flex gap-4">
      <button id="lightboxZoomIn" class="p-2 border border-claude-border rounded-full hover:bg-claude-surface"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg></button>
      <button id="lightboxZoomOut" class="p-2 border border-claude-border rounded-full hover:bg-claude-surface"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg></button>
      <button id="lightboxClose" class="p-2 border border-claude-border rounded-full hover:bg-claude-surface"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
    </div>
    <div class="w-full h-full flex items-center justify-center p-8">
      <img id="lightboxImage" src="" alt="Full size" class="max-w-full max-h-full object-contain cursor-grab active:cursor-grabbing shadow-2xl border editorial-border">
    </div>
  </div>

  <div id="pearlbookModal" class="fixed inset-0 z-50 hidden bg-claude-bg/95 dark:bg-dark-bg/95 backdrop-blur-sm opacity-0 transition-opacity" tabindex="-1">
    <div class="w-full h-full flex items-center justify-center p-4 md:p-8">
      <div class="w-full max-w-4xl max-h-full flex flex-col bg-claude-bg dark:bg-dark-bg border editorial-border shadow-2xl">
        <div class="px-8 py-6 border-b border-claude-border flex justify-between items-center">
          <div>
            <h2 class="text-3xl font-display font-bold text-claude-accent">Pearlbook</h2>
            <p class="text-sm font-sans text-claude-muted tracking-widest uppercase">Clinical Pearls</p>
          </div>
          <button id="closePearlbook" class="p-2 hover:bg-claude-surface transition-colors rounded-full border border-claude-border">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div id="pearlbookContent" class="flex-1 overflow-y-auto p-8 prose max-w-none"></div>
      </div>
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    window.addEventListener("load", () => {
      if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    });
  </script>
  <script src="./lectures_search_index.js"></script>
  <script src="./app.js?v=atlantic9" defer></script>
</body>
</html>
