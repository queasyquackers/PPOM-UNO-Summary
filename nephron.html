  h += '<div class="card"><h2>Who squeezes which arteriole</h2>' +
       '<p class="cap">The exam question is always: what happens to GFR, RPF and filtration fraction (FF = GFR/RPF)?</p>' +
       '<div class="tablewrap"><table class="grid"><thead><tr><th>Agent</th><th>Afferent</th><th>Efferent</th><th>GFR</th><th>RPF</th><th>FF</th></tr></thead><tbody>' +
       [['Angiotensin II','— (mild)','<b>constrict</b>','<span class="up">↑</span>','<span class="down">↓</span>','<span class="up">↑↑</span>'],
        ['ACE inhibitor / ARB','—','<b>dilate</b>','<span class="down">↓</span>','<span class="up">↑</span>','<span class="down">↓</span>'],
        ['Prostaglandins (PGE₂, PGI₂)','<b>dilate</b>','—','<span class="up">↑</span>','<span class="up">↑</span>','—'],
        ['NSAIDs','<b>constrict</b> (PG blocked)','—','<span class="down">↓</span>','<span class="down">↓</span>','—'],
        ['Sympathetic / norepinephrine (α₁)','<b>constrict</b>','constrict','<span class="down">↓</span>','<span class="down">↓↓</span>','<span class="up">↑</span>'],
        ['ANP / BNP','<b>dilate</b>','constrict','<span class="up">↑↑</span>','<span class="up">↑</span>','<span class="up">↑</span>'],
        ['Endothelin','constrict','constrict','<span class="down">↓</span>','<span class="down">↓</span>','—'],
        ['Adenosine (from macula densa)','<b>constrict</b>','—','<span class="down">↓</span>','<span class="down">↓</span>','—'],
        ['Dopamine (low dose, D₁)','<b>dilate</b>','—','<span class="up">↑</span>','<span class="up">↑↑</span>','<span class="down">↓</span>']
       ].map(function(r){ return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td><td>' + r[4] + '</td><td>' + r[5] + '</td></tr>'; }).join('') +
       '</tbody></table></div>' +
       '<div class="callout" style="margin-top:14px"><span class="lbl">Shortcut</span>' +
       'Constricting the <b>efferent</b> arteriole traps blood <i>inside</i> the glomerulus → pressure up, flow down, FF up. ' +
       'Constricting the <b>afferent</b> arteriole starves it → everything down.</div></div>';

  h += pearlsCard(seg);
  return h;
}

/* ==========================================================================
   5. PAGE ASSEMBLY
   ========================================================================== */
function cz(s){
  return String(s).replace(/\{\{c(\d+)::(.*?)\}\}/g, function(m, n, body){
    var parts = body.split('::');
    return '<span class="cz" data-c="' + n + '">' + parts[0] + '</span>';
  });
}

function segHeader(seg){
  var h = '<div class="seg-head"><div class="where">' + esc(seg.where) + '</div><h2>' + esc(seg.name) + '</h2>' +
          '<p class="headline">' + esc(seg.headline) + '</p></div>';
  if (seg.chips) h += '<div class="chips">' + seg.chips.map(function(c){ return '<span class="chip">' + c + '</span>'; }).join('') + '</div>';
  if (seg.osmo) h += '<div class="callout"><span class="lbl">Tubular fluid osmolality</span>' + seg.osmo + '</div>';
  return h;
}

function pearlsCard(seg){
  if (!seg.pearls || !seg.pearls.length) return '';
  return '<div class="card"><h2>High-yield, already clozed</h2>' +
         '<p class="cap">Every highlighted phrase is a cloze deletion. Turn on <b>Cloze mode</b> to blank them, tap one to reveal it, or hit <b>Export Anki</b> to take them with you.</p>' +
         '<ul class="pearls">' + seg.pearls.map(function(p){ return '<li>' + cz(p) + '</li>'; }).join('') + '</ul></div>';
}

/* Selecting an agent re-renders ONLY its own panel, so the page does not
   jump and the other panels keep whatever they were showing. */
var PANEL_REG = {}, modSel = {};

function pickMod(pid, i){
  modSel[pid] = (modSel[pid] === i) ? -1 : i;
  var host = document.getElementById(pid);
  if (host && PANEL_REG[pid]) host.innerHTML = renderPanel(PANEL_REG[pid], pid, modSel[pid]);
}
window.pickMod = pickMod;

function renderSegmentPage(seg){
  if (seg.custom === 'glomerulus') return renderGlomerulusPage(seg);
  var h = segHeader(seg);
  (seg.panels || []).forEach(function(p, pi){
    var pid = seg.id + '-p' + pi;
    PANEL_REG[pid] = p;
    if (modSel[pid] == null) modSel[pid] = -1;
    h += '<div class="card"><h2>' + esc(p.title) + '</h2><p class="cap">' + esc(p.caption) + '</p>' +
         '<div id="' + pid + '">' + renderPanel(p, pid, modSel[pid]) + '</div></div>';
  });
  h += pearlsCard(seg);
  return h;
}

/* ==========================================================================
   6. STATE + CONTROLS
   ========================================================================== */
var state = { tab:0, sub:0 };
var view  = document.getElementById('view');
var tabsEl = document.getElementById('tabs');

/* tab 0 = Overview, tab 1 = Diuretics, then one tab per segment */
function tabList(){ return ['Overview', 'Diuretics'].concat(SEGMENTS.map(function(s){ return s.tab; })); }

function renderTabs(){
  tabsEl.innerHTML = tabList().map(function(t, i){
    return '<button class="' + (i === state.tab ? 'on' : '') + '" onclick="setTab(' + i + ')">' + esc(t) + '</button>';
  }).join('');
}

function render(){
  renderTabs();
  view.innerHTML = state.tab === 0 ? renderOverviewPage()
                 : state.tab === 1 ? renderDrugsPage()
                 : renderSegmentPage(SEGMENTS[state.tab - 2]);
  window.scrollTo(0, 0);
}
function setTab(i){ state.tab = i; render(); }
function setSub(i){ state.sub = i; render(); }
function go(id){
  var idx = SEGMENTS.map(function(s){ return s.id; }).indexOf(id);
  if (idx >= 0) setTab(idx + 2);
}
window.setTab = setTab; window.setSub = setSub; window.go = go;

/* cloze mode */
var btnHide = document.getElementById('btn-hide');
var btnReveal = document.getElementById('btn-reveal');
function toggleHide(){
  document.body.classList.toggle('hide');
  var on = document.body.classList.contains('hide');
  btnHide.classList.toggle('on', on);
  btnReveal.classList.toggle('hidden', !on);
  if (!on) document.querySelectorAll('.cz.shown').forEach(function(e){ e.classList.remove('shown'); });
}
btnHide.onclick = toggleHide;
btnReveal.onclick = function(){
  var all = document.querySelectorAll('.cz');
  var anyHidden = false;
  all.forEach(function(e){ if (!e.classList.contains('shown')) anyHidden = true; });
  all.forEach(function(e){ e.classList.toggle('shown', anyHidden); });
};
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('.cz') : null;
  if (t && document.body.classList.contains('hide')) t.classList.toggle('shown');
});

/* pause */
var btnPause = document.getElementById('btn-pause');
btnPause.onclick = function(){
  var on = document.body.classList.toggle('paused');
  btnPause.classList.toggle('on', on);
  btnPause.textContent = on ? 'Play' : 'Pause';
};

/* theme */
var btnTheme = document.getElementById('btn-theme');
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  btnTheme.textContent = t === 'dark' ? 'Light' : 'Dark';
  try { localStorage.setItem('nephron-theme', t); } catch(e){}
}
btnTheme.onclick = function(){
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
};
(function(){
  var saved = null;
  try { saved = localStorage.getItem('nephron-theme'); } catch(e){}
  setTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
})();

/* ==========================================================================
   7. ANKI CLOZE EXPORT
   ========================================================================== */
function fluxPhrase(t, side){
  return t.flux.map(function(f){
    var d;
    if (side === 'apical') d = f.dir === 'in' ? 'from lumen into the cell' : 'from the cell into the lumen';
    else                   d = f.dir === 'in' ? 'from blood into the cell' : 'from the cell into the blood';
    return (f.n ? f.n + ' ' : '') + f.ion + ' ' + d;
  }).join('; ');
}
function tag(seg){ return 'Nephron::' + seg.tab.replace(/\s+/g, '_'); }
function clean(s){ return String(s).replace(/[\t\r\n]+/g, ' ').replace(/\s+/g, ' ').trim(); }

function buildCards(){
  var rows = [];
  SEGMENTS.forEach(function(seg){
    (seg.panels || []).forEach(function(panel){
      [['apical', panel.apical || []], ['basolateral', panel.baso || []]].forEach(function(pair){
        var side = pair[0];
        pair[1].forEach(function(t){
          var gene = '';
          var fp = fluxPhrase(t, side);

          if (fp){
            rows.push([ seg.tab + ' · ' + side + ' membrane: the transporter that moves ' + fp +
                        ' is {{c1::' + t.name + '}}' + gene + '.', clean(t.note || ''), tag(seg) ]);
            rows.push([ seg.tab + ' · <b>' + t.name + '</b> sits on the {{c1::' + side +
                        '}} membrane and moves {{c2::' + fp + '}}.', clean(t.note || ''), tag(seg) ]);
          } else {
            rows.push([ seg.tab + ' · {{c1::' + t.name + '}}' + gene + ' — ' +
                        clean(t.note || 'located on the ' + side + ' membrane') , '', tag(seg) ]);
          }
          (t.mods || []).forEach(function(m){
            var verb = m.e === 'up' ? 'STIMULATED' : m.e === 'down' ? 'INHIBITED' : 'modulated';
            rows.push([ seg.tab + ' · ' + t.name + ' is {{c1::' + verb + '}} by {{c2::' + m.n + '}}' +
                        (m.via ? ' ({{c3::' + m.via + '}})' : '') + '.',
                        clean((m.chain || '') + (m.result ? ' ⇒ ' + m.result : '') || t.note || ''), tag(seg) ]);
            /* the consequence chain is the part worth actually memorising */
            if (m.chain){
              rows.push([ seg.tab + ' · <b>' + m.n + '</b> on ' + t.name + ': {{c1::' + m.chain + '}}',
                          clean(m.result || ''), tag(seg) ]);
            }
            if (m.result){
              rows.push([ seg.tab + ' · Net effect of <b>' + m.n + '</b> at ' + t.name + ': {{c1::' + m.result + '}}',
                          clean(m.chain || ''), tag(seg) ]);
            }
          });
        });
      });
    });
    (seg.pearls || []).forEach(function(p){
      rows.push([ clean(p), seg.name, tag(seg) ]);
    });
  });

  /* substance / percentage cards */
  var keyName = { pct:'PCT', tdl:'thin descending limb', tasc:'thin ascending limb', tal:'TAL', dct:'DCT', cd:'collecting duct' };
  SUBSTANCES.forEach(function(sub){
    Object.keys(sub.seg).forEach(function(k){
      var v = sub.seg[k];
      if (!v || v === '—') return;
      rows.push([ 'Handling of <b>' + sub.label + '</b> in the {{c1::' + keyName[k] + '}}: {{c2::' + v + '}}',
                  clean(sub.note), 'Nephron::Percentages' ]);
    });
    rows.push([ '<b>' + sub.label + '</b> — fraction of the filtered load finally excreted: {{c1::' + sub.ex + '}}',
                clean(sub.note), 'Nephron::Percentages' ]);
  });
  return rows;
}

document.getElementById('btn-export').onclick = function(){
  var rows = buildCards();
  var out = '#separator:tab\n#html:true\n#notetype:Cloze\n#deck:Nephron Transport\n#tags column:3\n';
  rows.forEach(function(r){ out += clean(r[0]) + '\t' + clean(r[1]) + '\t' + r[2] + '\n'; });
  var blob = new Blob([out], {type:'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nephron_cloze_anki.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  var b = document.getElementById('btn-export');
  var old = b.textContent;
  b.textContent = rows.length + ' cards ↓';
  setTimeout(function(){ b.textContent = old; }, 2600);
};

/* ==========================================================================
   8. QUIZ
   ========================================================================== */
function buildQuiz(){
  var qs = [];
  SEGMENTS.forEach(function(seg){
    (seg.panels || []).forEach(function(panel){
      [['apical', panel.apical || []], ['basolateral', panel.baso || []]].forEach(function(pair){
        var side = pair[0];
        pair[1].forEach(function(t){
          var fp = fluxPhrase(t, side);
          if (fp){
            qs.push({ tag:seg.tab, q:'In the ' + seg.tab + ', which ' + side + ' transporter moves ' + fp + '?',
                      a:t.name + (t.note ? ' — ' + t.note : '') });
            qs.push({ tag:seg.tab, q:'What does ' + t.name + ' do, and which membrane is it on?',
                      a:'In the ' + seg.name + ', on the ' + side + ' membrane: ' + fp + '.' + (t.note ? ' ' + t.note : '') });
          }
          (t.mods || []).forEach(function(m){
            qs.push({ tag:seg.tab, q:'What effect does ' + m.n + ' have on ' + t.name + ' (' + seg.tab + ')?',
                      a:(m.e === 'up' ? 'STIMULATES it' : m.e === 'down' ? 'INHIBITS it' : 'modulates it') +
                        (m.via ? ' — via ' + m.via : '') + '. ' +
                        (m.chain ? m.chain + (m.result ? ' ⇒ ' + m.result : '') : (t.note || '')) });
            if (m.chain){
              qs.push({ tag:seg.tab, q:'Trace the mechanism: ' + m.n + ' acting on ' + t.name + ' in the ' + seg.tab + '. What happens, step by step, and what is the net result?',
                        a:m.chain + (m.result ? '  ⇒  ' + m.result : '') });
            }
          });
        });
      });
    });
    (seg.pearls || []).forEach(function(p){
      qs.push({ tag:seg.tab, cloze:p });
    });
  });
  var keyName = { pct:'PCT', tdl:'thin descending limb', tasc:'thin ascending limb', tal:'TAL', dct:'DCT', cd:'collecting duct' };
  SUBSTANCES.forEach(function(sub){
    Object.keys(sub.seg).forEach(function(k){
      if (!sub.seg[k] || sub.seg[k] === '—') return;
      qs.push({ tag:'Percentages', q:'How is ' + sub.label + ' handled in the ' + keyName[k] + '?',
                a:sub.seg[k] + ' — ' + sub.note });
    });
  });
  return qs;
}

var QUIZ = [], qIdx = 0, qSeen = 0;
var quizcard = document.getElementById('quizcard');
var quizbox  = document.getElementById('quizbox');

function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function showQuestion(reveal){
  var q = QUIZ[qIdx];
  var body;
  if (q.cloze){
    body = '<div class="meta">' + esc(q.tag) + ' · fill the blanks</div>' +
           '<div class="q">' + (reveal ? cz(q.cloze) : q.cloze.replace(/\{\{c\d+::(.*?)\}\}/g, function(m, b){
             return '<span style="background:var(--cz-hide); border-radius:3px; padding:0 14px">&nbsp;</span>';
           })) + '</div>';
  } else {
    body = '<div class="meta">' + esc(q.tag) + '</div><div class="q">' + esc(q.q) + '</div>' +
           (reveal ? '<div class="a">' + esc(q.a) + '</div>' : '');
  }
  quizbox.innerHTML = body;
  document.getElementById('quiz-count').textContent = 'Q' + (qSeen + 1) + ' of ' + QUIZ.length + ' available';
}
document.getElementById('btn-quiz').onclick = function(){
  if (!QUIZ.length) QUIZ = shuffle(buildQuiz());
  quizcard.classList.remove('hidden');
  qIdx = Math.floor(Math.random() * QUIZ.length);
  showQuestion(false);
  quizcard.scrollIntoView({behavior:'smooth', block:'start'});
};
document.getElementById('quiz-show').onclick = function(){ showQuestion(true); };
document.getElementById('quiz-next').onclick = function(){
  qSeen++; qIdx = (qIdx + 1) % QUIZ.length; showQuestion(false);
};
document.getElementById('quiz-close').onclick = function(){ quizcard.classList.add('hidden'); };

/* ==========================================================================
   9. KEYBOARD + BOOT
   ========================================================================== */
document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  var n = tabList().length;
  if (e.key === 'ArrowRight'){ setTab((state.tab + 1) % n); }
  else if (e.key === 'ArrowLeft'){ setTab((state.tab - 1 + n) % n); }
  else if (e.key === 'h'){ toggleHide(); }
  else if (e.key === 'r'){ btnReveal.click(); }
  else if (e.key === 'q'){ document.getElementById('btn-quiz').click(); }
  else if (e.key === ' '){ e.preventDefault(); btnPause.click(); }
});

render();
</script>
