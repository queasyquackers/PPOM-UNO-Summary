<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nephron Transport Atlas</title>
<style>
/* ==========================================================================
   Nephron Transport Atlas — standalone, offline, single file.
   Authoring rules borrowed from lecture_diagrams.js:
     1. CSS-only animation (no SMIL, no JS timers) — iPad Safari safe.
     2. Colors come from CSS variables so dark mode flips cleanly.
     3. Every <svg> has a viewBox and no fixed width/height.
     4. No hover-only information. Hover may enhance, never reveal.
     5. prefers-reduced-motion freezes everything; diagrams still read static.
   ========================================================================== */

:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#FBF9F4;
  --ink:#1a1a1a; --muted:#6b6257; --faint:#9a9086;
  --line:#E0D8C8; --accent:#D97757;

  --lumen:#FDF2E6; --lumen-ink:#8a5a3a;
  --cell:#F6C9AC; --cell2:#F0B189; --cell-edge:#D98F63;
  --inter:#F0E3EC; --inter-ink:#7a4f6b;
  --junction:#EFE7DA;

  --up:#2f7d4f;      /* stimulate */
  --down:#c0392b;    /* inhibit   */
  --cz-bg:#FBE6DC; --cz-hide:#E8DFD1;

  --na:#D97757; --k:#7C5CBF; --cl:#2f8577; --h:#c0392b; --hco3:#2E7DAF;
  --h2o:#3f9fd6; --ca:#B8860B; --mg:#5f8a2a; --po4:#8E44AD; --glu:#c98a06;
  --urea:#8A7B6B; --aa:#C0698F; --nh4:#9c5a2c; --oa:#5d7080; --other:#6b6257;
}
html[data-theme="dark"]{
  --bg:#1A1410; --surface:#231E18; --surface2:#1F1A15;
  --ink:#E8E0D4; --muted:#A99C89; --faint:#7d7264;
  --line:#3a332a; --accent:#E8956D;

  --lumen:#2A2118; --lumen-ink:#d4a97f;
  --cell:#57392a; --cell2:#6b4632; --cell-edge:#8f5c40;
  --inter:#33222e; --inter-ink:#d6a6c4;
  --junction:#2b241c;

  --up:#5fbe84; --down:#e8776b;
  --cz-bg:#3a2a22; --cz-hide:#332c24;

  --na:#E8956D; --k:#a58ae0; --cl:#4fb3a0; --h:#e8776b; --hco3:#5fa8dc;
  --h2o:#6cc0ee; --ca:#e0b64a; --mg:#96c14f; --po4:#b57ede; --glu:#e5b53d;
  --urea:#b7a793; --aa:#e094b4; --nh4:#c9885a; --oa:#93a6b5; --other:#A99C89;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-0.01em}

/* ---------- shell ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 18px 80px}
header.top{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line);
}
.top-inner{max-width:1180px; margin:0 auto; padding:12px 18px 0}
.titlebar{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.titlebar h1{font-size:20px}
.titlebar .sub{color:var(--muted); font-size:13px}
.tools{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap}
button{
  font:inherit; font-size:12.5px; font-weight:600; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:7px;
  padding:5px 10px; cursor:pointer; white-space:nowrap;
}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent); border-color:var(--accent); color:#fff}

nav.tabs{display:flex; gap:2px; overflow-x:auto; padding:10px 0 0; scrollbar-width:thin}
nav.tabs button{
  border:none; border-bottom:2.5px solid transparent; border-radius:0;
  background:none; padding:7px 11px; color:var(--muted); font-size:13px;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--accent); border-bottom-color:var(--accent); background:none}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:18px 20px; margin:16px 0;
}
.card > h2{font-size:17px; margin-bottom:2px}
.card > .cap{color:var(--muted); font-size:13px; margin-bottom:10px}

.seg-head{margin:20px 0 4px}
.seg-head h2{font-size:24px}
.seg-head .where{color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.seg-head .headline{font-size:15.5px; color:var(--muted); margin-top:4px; max-width:76ch}

.chips{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
.chip{
  font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px;
  background:var(--surface); border:1px solid var(--line);
}
.chip b{font-weight:800}

.callout{
  border-left:3px solid var(--accent); background:var(--surface2);
  padding:9px 14px; border-radius:0 8px 8px 0; margin:12px 0; font-size:14px;
}
.callout .lbl{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:2px}

ul.pearls{list-style:none; margin:0; padding:0}
ul.pearls li{
  padding:9px 0 9px 22px; border-bottom:1px dashed var(--line);
  position:relative; font-size:14.5px; line-height:1.55;
}
ul.pearls li:last-child{border-bottom:none}
ul.pearls li::before{content:"◆"; position:absolute; left:2px; top:9px; color:var(--accent); font-size:10px}

/* cloze spans */
.cz{
  background:var(--cz-bg); border-radius:3px; padding:0 3px;
  box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:600;
}
body.hide .cz{color:transparent; background:var(--cz-hide); border-radius:3px; cursor:pointer; user-select:none}
body.hide .cz::selection{color:transparent}
body.hide .cz.shown{color:var(--ink); background:var(--cz-bg)}

/* ---------- tables ---------- */
table.grid{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:8px}
table.grid th,table.grid td{border-bottom:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top}
table.grid th{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700}
table.grid tr:last-child td{border-bottom:none}
.up{color:var(--up); font-weight:700}
.down{color:var(--down); font-weight:700}
.tablewrap{overflow-x:auto}

/* ---------- svg frames ---------- */
.svgwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:6px -6px 0}
.svgwrap > svg{display:block; width:100%; min-width:880px; height:auto}
.svgwrap.narrow > svg{min-width:620px}
svg text{font-family:"Inter",system-ui,sans-serif; fill:var(--ink)}

.band-lumen{fill:var(--lumen)}
.band-inter{fill:var(--inter)}
.band-junction{fill:var(--junction)}
.cellbody{fill:var(--cell); stroke:var(--cell-edge); stroke-width:1.5}
.membrane{stroke:var(--cell-edge); stroke-width:3; fill:none}
.bandlbl{font-size:12.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase}
.bandlbl.l{fill:var(--lumen-ink)} .bandlbl.i{fill:var(--inter-ink)}
.bandsub{font-size:11px; font-weight:600}
.bandsub.l{fill:var(--lumen-ink)} .bandsub.i{fill:var(--inter-ink)}

.tname{font-size:12px; font-weight:700}
.tgene{font-size:10px; font-weight:500; fill:var(--muted)}
.ionlbl{font-size:12px; font-weight:700}
.tinylbl{font-size:10.5px; font-weight:600; fill:var(--muted)}
.icon-fill{fill:var(--surface); stroke:var(--cell-edge); stroke-width:1.6}
.icon-pump{fill:var(--surface); stroke:var(--ink); stroke-width:1.6}
.atp{font-size:9.5px; font-weight:800}

/* one selected agent draws one chip + one connector per target — no spaghetti */
.conn{fill:none; stroke-width:2.6}
.agentname{font-size:13px; font-weight:800}
.agentsub{font-size:9.5px; font-weight:600; fill:var(--muted)}
svg text.fxbadge{font-size:10px; font-weight:800; letter-spacing:.06em}
.dimmed{opacity:.26}

/* modulator picker */
.modbar{margin-top:14px; display:flex; flex-direction:column; gap:7px}
.modrow{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.modlab{
  font-size:10px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); width:74px; flex:none;
}
.modbtn{
  font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:20px;
  background:var(--surface); border:1px solid var(--line); cursor:pointer; color:var(--ink);
}
.modbtn:hover{border-color:var(--accent)}
.modbtn.on{color:#fff}
.modbtn.on.up{background:var(--up); border-color:var(--up)}
.modbtn.on.down{background:var(--down); border-color:var(--down)}
.modbtn.on.mixed{background:var(--accent); border-color:var(--accent)}
.minibtn{
  font-size:11px; font-weight:600; padding:2px 8px; margin-top:4px;
  border-radius:5px; background:var(--surface2); border:1px solid var(--line); cursor:pointer; color:var(--muted);
}
.minibtn:hover{border-color:var(--accent); color:var(--ink)}

/* effect readout */
.fxbox{
  margin-top:12px; border:1px solid var(--line); border-radius:10px;
  padding:11px 14px; background:var(--surface2);
}
.fxhint{color:var(--muted); font-size:13px; line-height:1.5}
.fxhead{font-size:13.5px; margin-bottom:4px}
.fxrow{padding:8px 0; border-bottom:1px dashed var(--line)}
.fxrow:last-child{border-bottom:none}
.fxt{font-weight:800; font-size:13.5px}
.fxside{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-left:6px}
.fxchain{font-size:13.5px; margin-top:3px; line-height:1.5}
.fxres{font-size:13px; margin-top:3px; color:var(--muted); line-height:1.45}
h3.subh{
  font-size:11.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:20px 0 2px;
}

/* ---------- drug consequence card ---------- */
.dcard{
  margin-top:14px; border:1.5px solid var(--accent); border-radius:12px;
  overflow:hidden; background:var(--surface);
}
.dhead{background:var(--cz-bg); padding:10px 14px; border-bottom:1px solid var(--line)}
.dhead .dn{font-size:15px; font-weight:800}
.dhead .dx{font-size:12.5px; color:var(--muted); margin-top:1px}
.dbody{padding:12px 14px}
.dmeta{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; margin-bottom:4px}
.dmeta div{background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px}
.dmeta b{display:block; font-size:10px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); margin-bottom:2px}

/* the cascade: a zone-coloured rail with one causal link per row */
.casc{margin:10px 0 2px}
.cstep{display:grid; grid-template-columns:86px 24px 1fr; align-items:start}
.czone{
  font-size:9.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  text-align:right; padding:3px 8px 0 0; color:var(--muted);
}
.crail{position:relative; align-self:stretch}
.crail::before{content:""; position:absolute; left:10px; top:4px; bottom:0; width:2px; background:var(--line)}
.cstep:last-child .crail::before{display:none}
.cdot{position:absolute; left:4px; top:4px; width:15px; height:15px; border-radius:50%;
  border:2.5px solid var(--surface); box-sizing:border-box}
.ctext{padding:1px 0 13px 8px; font-size:14px; line-height:1.5}
.cstep:last-child .ctext{padding-bottom:2px}
.z-cell{background:var(--cell-edge)} .z-lumen{background:var(--lumen-ink)}
.z-segment{background:var(--accent)} .z-distal{background:var(--k)} .z-body{background:var(--down)}

/* serum / urine signature */
.sig{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin-top:6px}
.sigrow{display:grid; grid-template-columns:20px 1fr; gap:7px; padding:6px 0; border-bottom:1px dashed var(--line)}
.sigrow:last-child{border-bottom:none}
.sigd{font-weight:800; font-size:14px; text-align:center; line-height:1.35}
.sigk{font-weight:700; font-size:13.5px}
.sigw{font-size:12.5px; color:var(--muted); line-height:1.45}
.d-up{color:var(--up)} .d-down{color:var(--down)} .d-none{color:var(--faint)} .d-var{color:var(--accent)}

/* uses / adverse */
.duo{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin-top:6px}
ul.dlist{list-style:none; margin:0; padding:0}
ul.dlist li{padding:6px 0 6px 16px; position:relative; font-size:13.5px; line-height:1.5;
  border-bottom:1px dashed var(--line)}
ul.dlist li:last-child{border-bottom:none}
ul.dlist li::before{content:"▪"; position:absolute; left:2px; top:6px; font-size:10px; color:var(--accent)}
ul.dlist li b{font-weight:700}
ul.dlist li span{color:var(--muted)}

/* state badges drawn inside the lumen / interstitium bands */
svg text.statelbl{font-size:11px; font-weight:800}

/* mechanism of action block */
.moa{display:grid; grid-template-columns:repeat(auto-fit,minmax(238px,1fr)); gap:9px; margin-top:6px}
.moa > div{background:var(--surface2); border:1px solid var(--line); border-radius:9px;
  padding:8px 11px; font-size:13.2px; line-height:1.5}
.moa b{display:block; font-size:10px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--accent); margin-bottom:3px}
.moa > div.wide{grid-column:1/-1; border-left:3px solid var(--accent)}

/* severity + correlate-kind chips */
.sev,.kind{
  font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:1px 7px; border-radius:10px; white-space:nowrap;
}
.sev{margin-left:7px}
.sev-common{background:var(--surface2); color:var(--muted); border:1px solid var(--line)}
.sev-serious{background:var(--down); color:#fff}
.sev-niche{background:var(--cz-bg); color:var(--accent); border:1px solid var(--accent)}
.kind{background:var(--surface2); color:var(--muted); border:1px solid var(--line)}
.k-treats{background:var(--up); color:#fff; border-color:var(--up)}
.k-causes{background:var(--down); color:#fff; border-color:var(--down)}
.k-mimics{background:var(--k); color:#fff; border-color:var(--k)}
.k-unmasks{background:var(--accent); color:#fff; border-color:var(--accent)}
.k-interacts{background:var(--surface2); color:var(--ink); border:1px solid var(--line)}
table.grid td .kind{display:inline-block}

/* diuretics comparison page */
.dgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-top:10px}
.dtile{border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px;
  padding:11px 13px; background:var(--surface2)}
.dtile h4{font-size:14.5px; margin-bottom:1px}
.dtile .site{font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em}
.dtile p{margin:6px 0 0; font-size:13px; line-height:1.5}

/* ---------- animation (CSS only) ---------- */
@keyframes flowx{
  0%{transform:translateX(0); opacity:0}
  14%{opacity:1}
  80%{opacity:1}
  100%{transform:translateX(var(--dx)); opacity:0}
}
.flow{animation:flowx var(--dur,2.8s) linear infinite; animation-delay:var(--dl,0s)}
body.paused .flow{animation-play-state:paused}

@keyframes tubeflow{ to{ stroke-dashoffset:-140 } }
.tubeflow{stroke-dasharray:9 13; animation:tubeflow 3.2s linear infinite}
body.paused .tubeflow{animation-play-state:paused}

@keyframes pulse{ 0%,100%{opacity:.35} 50%{opacity:1} }
.pulse{animation:pulse 2.6s ease-in-out infinite}
body.paused .pulse{animation-play-state:paused}

/* Fallback only (no offset-path): straight hops between waypoints, so the dot
   cuts across the PCT and DCT coils. Absolute coords — there is no longer a
   wrapping translate(140,80) group. */
@keyframes nephronRun{
  0%   {transform:translate(140px,80px)} /* Bowman → PCT coil        */
  11%  {transform:translate(318px,104px)}/* coil turns down          */
  19%  {transform:translate(318px,236px)}/* enters medulla           */
  33%  {transform:translate(318px,470px)}/* end thin descending      */
  37%  {transform:translate(360px,512px)}/* hairpin bottom           */
  41%  {transform:translate(402px,470px)}/* start thin ascending     */
  45%  {transform:translate(402px,400px)}/* start TAL                */
  62%  {transform:translate(402px,120px)}/* macula densa → DCT       */
  74%  {transform:translate(616px,120px)}/* end DCT                  */
  100% {transform:translate(616px,552px)}/* down the collecting duct */
}
.tubedot{animation:nephronRun 13s linear infinite; animation-delay:var(--dl,0s)}
body.paused .tubedot{animation-play-state:paused}

/* Preferred: ride the real tubule path, coils included. The path itself is set
   inline per dot, rebuilt from MAP_SEGS so it tracks the drawn geometry. */
@keyframes nephronTrace{ from{offset-distance:0%} to{offset-distance:100%} }
@supports (offset-path: path("M0,0 L1,1")){
  .tubedot{animation-name:nephronTrace; offset-rotate:0deg}
}

@media (prefers-reduced-motion:reduce){
  .flow,.tubeflow,.pulse,.tubedot{animation:none !important}
  .flow{opacity:1; transform:translateX(calc(var(--dx) * .5))}
}

/* ---------- quiz ---------- */
#quizbox .q{font-size:16.5px; font-weight:600; line-height:1.45; margin-bottom:10px}
#quizbox .a{
  font-size:15px; background:var(--surface2); border-left:3px solid var(--up);
  padding:10px 14px; border-radius:0 8px 8px 0; margin-bottom:12px;
}
#quizbox .meta{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-bottom:6px}
.hidden{display:none !important}

/* ---------- legend ---------- */
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:12.5px; color:var(--muted); margin-top:10px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.swatch{width:22px; height:12px; border-radius:3px; border:1px solid var(--line); display:inline-block}

.foot{color:var(--faint); font-size:12px; text-align:center; margin-top:36px; line-height:1.7}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:1px 5px}

@media print{
  header.top{position:static}
  nav.tabs,.tools,#quizcard{display:none !important}
  .card{break-inside:avoid; border-color:#ccc}
  body{background:#fff}
  .svgwrap{overflow:visible}
  .svgwrap > svg{min-width:0}
}
@media (max-width:640px){
  .titlebar h1{font-size:17px}
  .wrap{padding:0 12px 60px}
  .card{padding:14px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="titlebar">
      <h1>Nephron Transport Atlas</h1>
      <span class="sub">segment · channel · hormone · drug</span>
      <div class="tools">
        <button id="btn-hide" title="Blank out every cloze deletion (key: h)">Cloze mode</button>
        <button id="btn-reveal" class="hidden" title="Reveal every blank (key: r)">Reveal all</button>
        <button id="btn-pause" title="Freeze all motion (key: space)">Pause</button>
        <button id="btn-quiz" title="Random question drill (key: q)">Quiz me</button>
        <button id="btn-export" title="Download a tab-separated cloze file for Anki">Export Anki</button>
        <button id="btn-theme" title="Light / dark">Dark</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<div class="wrap">
  <div id="quizcard" class="card hidden">
    <div id="quizbox"></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap">
      <button id="quiz-show">Show answer</button>
      <button id="quiz-next">Next question &rarr;</button>
      <button id="quiz-close">Close</button>
      <span style="margin-left:auto; font-size:12px; color:var(--muted); align-self:center" id="quiz-count"></span>
    </div>
  </div>
  <main id="view"></main>
  <div class="foot">
    Built to be clozed. <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> switch segment ·
    <span class="kbd">h</span> cloze mode · <span class="kbd">r</span> reveal · <span class="kbd">space</span> pause ·
    <span class="kbd">q</span> quiz<br />
    Percentages are the standard teaching values (Boron/Costanzo/First Aid) — they are approximations of filtered load, not lab values.
  </div>
</div>

<script>
/* ==========================================================================
   1. DATA
   ========================================================================== */

/* flux direction is always relative to THE CELL:
     apical  'in'  = lumen  -> cell   (step 1 of reabsorption)
     apical  'out' = cell   -> lumen  (secretion)
     baso    'in'  = blood  -> cell
     baso    'out' = cell   -> blood  (final step of reabsorption)
   paracellular 'in' = lumen -> blood, 'out' = blood -> lumen              */
function F(ion, dir, opts){ return Object.assign({ion:ion, dir:dir}, opts||{}); }
/* kind: ch=channel  co=cotransporter  ex=exchanger  pump=ATPase  enz=enzyme  rec=receptor */
function T(name, gene, kind, flux, opts){
  return Object.assign({name:name, gene:gene, kind:kind, flux:flux}, opts||{});
}
/* modulators. e: 'up' | 'down' | 'other'.  side: 'blood' (default for hormones) | 'lumen' */
function H(n, e, via, note){ return {n:n, e:e, via:via, t:'hormone', side:'blood', note:note}; }
function D(n, e, via, note){ return {n:n, e:e, via:via, t:'drug',    side:'lumen', note:note}; }
function DB(n, e, via, note){ return {n:n, e:e, via:via, t:'drug',   side:'blood', note:note}; }
/* Inline-authored modulator: carries its own chain/result/strength instead of an
   FX index, so it can be added anywhere. o = {c:chain, r:result, s:strength,
   k:drug-class id, side:'lumen'|'blood'} */
function DX(n, e, via, o){
  return {n:n, e:e, via:via, t:'drug', side:(o.side || 'lumen'),
          chain:o.c, result:o.r, strength:(o.s || 'partial'), cls:o.k};
}

  "contrast": [
   "Hyponatremia is the thiazide's disease, not the loop's. Thiazides impair diluting ability but not concentrating ability - the medullary gradient is untouched, ADH still inserts AQP2, so retained water dilutes serum Na⁺, and the lecture's summary calls thiazides the highest risk / major cause of diuretic-induced hyponatremia. Loop diuretics collapse the medullary gradient and impair BOTH concentrating and diluting ability, so their risk of hyponatremia is lower",
   "Calcium is the opposite in the two classes. Loops eliminate the transepithelial potential in the TAL, so Ca²⁺ and Mg²⁺ are excreted → a loop is the adjunct for hypercalcemia after IV hydration. Thiazides lower intracellular Na⁺, speed basolateral NCX1, and the resulting low intracellular Ca²⁺ pulls filtered Ca²⁺ in via TRPV5 → urinary Ca²⁺ falls, which is why thiazides (not loops) are the stone drug in idiopathic hypercalciuria",
   "Ceiling of natriuresis follows the segment: loop diuretics block up to ~25% of filtered Na⁺ at NKCC2 in the TAL (Na⁺ '++++'), thiazides ~5-10% at NCC in the early DCT (Na⁺ '++'), and the K⁺-sparing agents only ~2-5% at the principal cell ('+'). Loop plus thiazide together is '+++++' - the synergy of sequential nephron blockade",
   "Acid-base splits the lecture pair three ways: thiazides and loops both give hypokalemic metabolic alkalosis; carbonic anhydrase inhibitors give a hyperchloremic metabolic acidosis with heavy urinary HCO₃⁻ ('+++'); ENaC inhibitors and MR antagonists retain K⁺ and H⁺ and give a mild metabolic acidosis. Thiazides lose only a slight amount of HCO₃⁻ ('+')",

  "genetic": "Gitelman syndrome - defective sodium reabsorption in the distal tubule, described in the Renal Slide Book as similar to giving a thiazide diuretic. It presents in childhood with polyuria, polydipsia or nocturia, RAAS activation producing metabolic alkalosis, hypokalemia with muscle cramps, and LOW urinary calcium because the distal tubule cannot secrete Ca²⁺. Its counterpart is Bartter syndrome - defective Na⁺ reabsorption in the thick ascending limb, the loop diuretic phenocopy, with the same polyuria, hypokalemia and metabolic alkalosis but HIGH urinary calcium because the TAL cannot absorb Ca²⁺",

 "ksp": {
  "id": "ksp",
  "name": "Potassium-sparing diuretics: ENaC inhibitors and mineralocorticoid receptor antagonists (MRAs)",
  "examples": "ENaC inhibitors: amiloride (starred - \"a very important drug, widely used\"), triamterene; MR antagonists (aldosterone antagonists): spironolactone (starred, \"the prototype\"), eplerenone, finerenone (nonsteroidal MRA approved for treatment of chronic kidney disease)",
  "segId": "cd",
  "targetName": "Two targets, one class: the luminal epithelial sodium channel (ENaC) of the principal cell for amiloride and triamterene, and the high-affinity mineralocorticoid receptor (MR) in the cytosol of the principal cell for spironolactone, eplerenone and finerenone - both at the aldosterone-sensitive sites (late DCT, connecting tubule, collecting ducts; the lecture's site table says cortical collecting duct principal cells)",
  "targetSide": "both",
  "mech": "ENaC inhibitors reduce the passive apical entry of Na⁺ by blocking the luminal epithelial Na⁺ channel, while MRAs are competitive antagonists of aldosterone that pass through the basolateral membrane to block the mineralocorticoid receptor in the cytosol - either route reduces Na⁺ reabsorption in the principal cell, abolishes the lumen-negative transepithelial potential, and removes the electrochemical gradient for K⁺ secretion.",
  "delivery": "The two sub-mechanisms are delivered differently, and the lecture makes the difference the discriminating point. ENaC inhibitors act on the LUMINAL side, so the drug has to reach the tubular fluid: they are orally absorbed and moderately protein bound, with amiloride distributed to the nephron by glomerular filtration AND OCT (organic cation transporter) secretion, and triamterene by OCT secretion alone. MR antagonists never need the tubular fluid at all: they pass through the BASOLATERAL membrane and bind the MR in the cytosol, the way corticosteroids act at glucocorticoid receptors - which is also why eplerenone's duration (7-9 h) outlasts what its half-life predicts, \"because it acts inside the cell on the mineralocorticoid receptor.\" What blunts delivery: the lecture's NSAID summary states that NSAIDs worsen renal hemodynamics and reduce diuretic delivery - afferent arteriolar constriction lowers renal blood flow and GFR - and for the K⁺-sparing agents specifically the fall in GFR reduces K⁺ excretion, adding to the drug's own K⁺ retention. Renal impairment does the same and is a named hyperkalemia risk factor.",
  "potency": "Ceiling ~2-5% of the filtered Na⁺ load - the lecture's own definition of a weak diuretic: \"Approximately 2-5% of sodium excretion occurs in the principal cells. Therefore, ENaC inhibitors and MR antagonists block only a small fraction of the total sodium, thus water, reabsorption by the kidneys.\" One modifier applies only to the MRAs: \"the higher the patient's aldosterone level, the greater the effects of MR antagonists on urinary excretion of electrolytes\" - where aldosterone is not activating the receptor, the antagonist does much less.",
  "lumenFx": "Na⁺ stays; lumen-negative potential gone, so K⁺ is not secreted",
  "interFx": "K⁺ and H⁺ retained; Na⁺ loss capped at ~2-5% of filtered load",
  "moa": {
   "bind": "Amiloride and triamterene are distributed to the nephron by the organic cation transporter (OCT) - amiloride also by glomerular filtration - and block the renal epithelial Na⁺ channel (ENaC) from the LUMINAL side of the principal cell; amiloride's long duration (~24 h) is related to high potency and slow dissociation from ENaC, not to its 6-9 h half-life. Spironolactone, eplerenone and finerenone are competitive antagonists of aldosterone at the mineralocorticoid receptor; spironolactone is a corticosteroid whose structure the lecture puts side by side with aldosterone to show the similarity. They reach the receptor by passing through the BASOLATERAL membrane to the high-affinity MR sitting in the cytosol, the same way corticosteroids act at glucocorticoid receptors - they never touch the channel. Cortisol also activates the MR, but 11-β-hydroxysteroid dehydrogenase type 2 shifts it to inactive cortisone, which allows MR activation by aldosterone only.",
   "consequence": "ENaC block blunts Na⁺ reabsorption: intracellular Na⁺ concentration and Na⁺/K⁺-ATPase function fall, the lumen-negative voltage gradient is neutralized, and the electrical gradient for K⁺ secretion through ROMK is lost. MR block prevents the receptor complex from translocating to the nucleus and binding the response elements that drive transcription of the aldosterone-induced proteins - so no upregulation of ENaC, no upregulation of Na⁺/K⁺-ATPase, no increased ROMK activity, and no aldosterone-driven H⁺ secretion from the type A intercalated cells. In addition, SGK is no longer activated to phosphorylate and inactivate Nedd4-2, so this ubiquitin ligase stays free to target existing ENaC for endocytosis and degradation. The net effect of MR blockade is the opposite of aldosterone's: excretion of Na⁺ and water, retention of K⁺ and H⁺.",
   "pk": "ENaC inhibitors - orally absorbed, moderately protein bound, minimally metabolized (amiloride) or hepatically metabolized (triamterene), renally excreted, half-lives long enough for once- or twice-daily dosing. Amiloride: bioavailability 30-90%, nephron distribution by glomerular filtration plus OCT secretion, ONSET of diuresis 2 h, DURATION ~24 h (1x daily), eliminated as unchanged drug in urine with the unabsorbed fraction in feces, t1/2 6-9 h. Triamterene: bioavailability 30-70%, nephron distribution by OCT secretion, onset 2-4 h, duration ~7-9 h (2x daily), hepatic metabolism to an active metabolite, renal excretion of drug and metabolite; the lecture does not list the parent t1/2 and says only that the active metabolite's t1/2 is considerably longer. MRAs - well absorbed, highly protein bound, hepatic metabolism, renal and biliary excretion. Spironolactone: protein binding >90%, bioavailability ~90% with a high-fat meal, rapid extensive hepatic metabolism to the ACTIVE metabolites canrenone (most potent) and 7-α-thiomethylspironolactone, with enterohepatic circulation; parent t1/2 only 1-2 h but canrenone 10-23 h and 7-α-thiomethylspironolactone 7-20 h, Tmax 3-4 h (active metabolite), and DURATION 2-3 DAYS, to which enterohepatic circulation contributes. Eplerenone: protein binding 50% (alpha1-acid glycoprotein), bioavailability 70%, hepatic CYP3A4 metabolism to INACTIVE metabolites, t1/2 3-6 h, Tmax ~1.5 h, duration still 7-9 h because it acts on an intracellular receptor. That CYP3A4 dependence changes management: grapefruit juice alone raises eplerenone AUC ~25%, and the manufacturer recommendation is to avoid strong CYP3A4 inhibitors and inducers with eplerenone (and finerenone).",
   "why": "Block Na⁺ reabsorption in the principal cell - by plugging the channel from the lumen or by switching off the gene program that builds and activates it from the cytosol - and the lumen-negative potential that drives K⁺ (and H⁺) out is abolished, so a weak natriuresis of only 2-5% comes packaged with K⁺ and H⁺ retention."
  },

  'Acetazolamide':'ca',
  'Mannitol':'osm',
  'Loop diuretics':'loop',
  'Thiazides':'thz',
  'Thiazides (chronic)':'thz',
  'Amiloride':'ksp',

(function attachFX(){
  var i = 0, applied = 0, inline = 0;
  SEGMENTS.forEach(function(seg){
    (seg.panels || []).forEach(function(p){
      [p.apical || [], p.baso || []].forEach(function(list){
        list.forEach(function(t){
          (t.mods || []).forEach(function(m){
            /* Mods authored with DX/HX carry their own chain. They are skipped
               WITHOUT advancing the counter, so a new modulator can be inserted
               anywhere without renumbering the 67 index-keyed entries above. */
            if (!m.cls && m.t === 'drug') m.cls = DRUG_CLASS_OF[m.n];
            if (m.chain){ inline++; return; }
            var f = FX[i++];
            if (f){ m.chain = f.c; m.result = f.r; m.strength = f.s; applied++; }
          });
        });
      });
    });
  });
  window.__fxStats = { seen: i, applied: applied, inline: inline };
})();

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ionVar(ion){ return 'var(' + (ION_COLOR[ion] || '--other') + ')'; }
/* the gene line is noise when it just repeats the transporter name (TRPV5, AQP2 …) */
function geneOf(t){ return (t.gene && t.gene !== '—' && t.gene !== t.name) ? t.gene : ''; }

/* piecewise arrow with a solid head.
   o = {w:stroke width, op:opacity, dash:true}  — the drug state is carried by the
   arrow itself, so a blocked flux LOOKS blocked even with the animation paused. */
function arrow(x1, x2, y, color, o){
  o = o || {};
  var dir = x2 > x1 ? 1 : -1;
  var tip = x2, tail = x1;
  var w  = o.w  || 1.7;
  var op = (o.op == null) ? 1 : o.op;
  var head = 'M' + tip + ',' + y + ' L' + (tip - 7*dir) + ',' + (y - 4.2) +
             ' L' + (tip - 7*dir) + ',' + (y + 4.2) + ' Z';
  return '<line x1="' + tail + '" y1="' + y + '" x2="' + (tip - 5*dir) + '" y2="' + y +
         '" stroke="' + color + '" stroke-width="' + w + '" opacity="' + op + '"' +
         (o.dash ? ' stroke-dasharray="6 6"' : '') + ' />' +
         '<path d="' + head + '" fill="' + color + '" opacity="' + op + '" />';
}

/* animated particles riding the arrow.
   dur = seconds for one traverse (bigger = slower), n = how many are in flight.
   Stimulated flux is fast and crowded, a damped flux is a slow trickle. */
function particles(x1, x2, y, ion, dur, n){
  var c = ionVar(ion), out = '', dx = (x2 - x1);
  dur = dur || 3.1;
  n   = (n == null) ? 2 : n;
  for (var i = 0; i < n; i++){
    out += '<g transform="translate(' + x1 + ',' + y + ')">' +
             '<g class="flow" style="--dx:' + dx + 'px; --dur:' + dur + 's; --dl:' +
               (-(dur / n) * i).toFixed(2) + 's">' +
               '<circle r="5.2" fill="' + c + '" opacity="0.9" />' +
             '</g></g>';
  }
  return out;
}

  }
  if (kind === 'ch'){
    /* channel = open pore: two posts with a gap */
    return '<rect x="' + x + '" y="' + y + '" width="13" height="' + h + '" rx="4" class="icon-fill" />' +
           '<rect x="' + (x + w - 13) + '" y="' + y + '" width="13" height="' + h + '" rx="4" class="icon-fill" />';
  }
  if (kind === 'enz'){
    var r = Math.max(15, h/2);
    return '<polygon points="' + [[cx-r,cy],[cx-r/2,cy-r*0.87],[cx+r/2,cy-r*0.87],[cx+r,cy],[cx+r/2,cy+r*0.87],[cx-r/2,cy+r*0.87]]
             .map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ') + '" class="icon-fill" />';
  }
  if (kind === 'rec'){
    return '<path d="M' + (cx-14) + ',' + (cy+h/2) + ' L' + (cx-14) + ',' + (cy-h/2+8) +
           ' Q' + cx + ',' + (cy-h/2-9) + ' ' + (cx+14) + ',' + (cy-h/2+8) +
           ' L' + (cx+14) + ',' + (cy+h/2) + ' Z" class="icon-fill" />';
  }
  /* co / ex = carrier oval */
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + Math.min(16, h/2) + '" class="icon-fill" />';
}

/* ---- one transporter row -------------------------------------------------
   fx  : null = resting | {e:'up'|'down', strength:'full'|'partial'}
   dim : true when some OTHER agent is selected and this row is untouched   */
function renderT(t, side, rowY, fx, dim){
  var n = Math.max(1, t.flux.length);
  var span = (n - 1) * 17;
  var memX = side === 'apical' ? MEM_A : MEM_B;
  var lines = '', dots = '', labels = '';
  var blocked = !!(fx && fx.e === 'down' && fx.strength === 'full');
  var slowed  = !!(fx && fx.e === 'down' && !blocked);
  var boosted = !!(fx && fx.e === 'up');

  t.flux.forEach(function(f, i){
    var y = rowY - span/2 + i*17;
    var c = ionVar(f.ion);
    var x1, x2, lx, anchor;
    if (side === 'apical'){
      if (f.dir === 'in'){ x1 = LUM_TIP; x2 = CELL_A; } else { x1 = CELL_A; x2 = LUM_TIP; }
      lx = LUM_TIP - 8; anchor = 'end';
    } else {
      if (f.dir === 'in'){ x1 = INT_TIP; x2 = CELL_B; } else { x1 = CELL_B; x2 = INT_TIP; }
      lx = INT_TIP + 8; anchor = 'start';
    }
    lines += arrow(x1, x2, y, c, { dash:blocked, op: blocked ? 0.28 : 1, w: boosted ? 3.2 : 1.7 });
    /* the flux itself carries the answer: blocked = nothing moves,
       stimulated = faster and more crowded, damped = a slow trickle */
    if (!blocked){
      dots += particles(x1, x2, y, f.ion, boosted ? 1.5 : slowed ? 6.4 : 3.1, boosted ? 3 : slowed ? 1 : 2);
    }
    labels += '<text class="ionlbl" x="' + lx + '" y="' + (y + 4) + '" text-anchor="' + anchor +
              '" fill="' + c + '"' + (blocked ? ' opacity="0.4"' : '') + '>' +
              esc((f.n ? f.n + ' ' : '') + f.ion) + '</text>';
  });

  var h = Math.max(30, n*17 + 16);
  var halo = '', slash = '', badge = '';
  var bx = side === 'apical' ? CELL_A + 14 : CELL_B - 14;
  var ba = side === 'apical' ? 'start' : 'end';
  if (fx && fx.dep){
    /* a knock-on, not a target: the drug binds nowhere near this protein, so it
       gets neither the halo nor the slash - only its flux goes quiet */
    badge = '<text class="fxbadge" x="' + bx + '" y="' + (rowY + 19) + '" text-anchor="' + ba + '" fill="var(--faint)">' +
            (blocked ? '↳ NO SUBSTRATE LEFT' : '↳ STARVED') + '</text>';
  } else if (fx){
    var hc = fx.e === 'up' ? 'var(--up)' : 'var(--down)';
    halo = '<rect x="' + (memX - 40) + '" y="' + (rowY - h/2 - 10) + '" width="80" height="' + (h + 20) +
           '" rx="13" fill="' + hc + '" opacity="0.15" stroke="' + hc + '" stroke-width="1.8" />';
    /* under the name inside the cell: below the icon it would land on the next row */
    badge = '<text class="fxbadge" x="' + bx + '" y="' + (rowY + 19) + '" text-anchor="' + ba + '" fill="' + hc + '">' +
            (boosted ? '▲ MORE' : blocked ? '✕ BLOCKED' : '▼ LESS') + '</text>';
    if (blocked){
      slash = '<line x1="' + (memX - 27) + '" y1="' + (rowY + h/2 + 9) + '" x2="' + (memX + 27) + '" y2="' + (rowY - h/2 - 9) +
              '" stroke="var(--down)" stroke-width="5.5" stroke-linecap="round" />';
    }
  }
  var icon = iconShape(t.kind, memX, rowY, h);

  var nx = side === 'apical' ? CELL_A + 14 : CELL_B - 14;
  var na = side === 'apical' ? 'start' : 'end';
  var name = '<text class="tname" x="' + nx + '" y="' + (rowY + 4) + '" text-anchor="' + na + '">' + esc(t.name) + '</text>';

  var g = '<g' + (dim ? ' class="dimmed"' : '') + '>' + lines + halo + icon + slash + name + labels + badge + '</g>';
  return { svg:g, dots: dim ? '<g class="dimmed">' + dots + '</g>' : dots };
}

/* Every hormone/drug in a panel, grouped by AGENT rather than by transporter —
   so picking "Aldosterone" lights up all four things it touches at once. */
function panelAgents(panel){
  var map = {}, order = [];
  [['apical', panel.apical || []], ['baso', panel.baso || []]].forEach(function(pair){
    pair[1].forEach(function(t, i){
      (t.mods || []).forEach(function(m){
        if (!map[m.n]){ map[m.n] = { name:m.n, kind:m.t, side:m.side, targets:[] }; order.push(m.n); }
        map[m.n].targets.push({ t:t, side:pair[0], row:i, mod:m });
      });
    });
  });
  return order.map(function(k){ return map[k]; });
}

/* a direct pharmacologic blocker abolishes its target; everything else modulates */
function strengthOf(m){
  if (m.strength) return m.strength;
  return (m.t === 'drug' && m.e === 'down' && !m.via) ? 'full' : 'partial';
}
function agentTone(a){
  var up = 0, dn = 0;
  a.targets.forEach(function(tg){ if (tg.mod.e === 'up') up++; else if (tg.mod.e === 'down') dn++; });
  return up && dn ? 'mixed' : dn ? 'down' : 'up';
}

/* ---- the selected agent's drug class, and its downstream card ------------ */
function agentClass(A){
  if (!A || A.kind !== 'drug') return null;
  for (var i = 0; i < A.targets.length; i++){
    if (A.targets[i].mod.cls) return A.targets[i].mod.cls;
  }
  return null;
}
function drugOf(A){ var k = agentClass(A); return k ? DRUGS[k] : null; }

var DIR_SYM = { up:'▲', down:'▼', none:'=', 'var':'↕' };
function sigList(rows){
  return (rows || []).map(function(r){
    return '<div class="sigrow"><div class="sigd d-' + (r.d || 'none') + '">' +
           (DIR_SYM[r.d] || '=') + '</div><div><div class="sigk">' + esc(r.k) + '</div>' +
           '<div class="sigw">' + esc(r.why) + '</div></div></div>';
  }).join('');
}
function dlist(items){
  return '<ul class="dlist">' + items.map(function(u){
    return typeof u === 'string' ? '<li>' + esc(u) + '</li>'
         : '<li><b>' + esc(u.n) + '</b> &mdash; <span>' + esc(u.why) + '</span></li>';
  }).join('') + '</ul>';
}

/* Everything the drug does AFTER the transporter it blocks — the part the cell
   diagram cannot show, because it happens in later segments and in the blood. */
function renderDrugCard(dc){
  var h = '<div class="dcard"><div class="dhead">' +
          '<div class="dn">' + esc(dc.name) + ' &mdash; the whole downstream story</div>' +
          '<div class="dx">' + esc(dc.examples) + '</div></div><div class="dbody">';

  h += '<div class="dmeta">' +
       '<div><b>In one line</b>' + esc(dc.mech) + '</div>' +
       '<div><b>How it reaches the target</b>' + esc(dc.delivery) + '</div>' +
       '<div><b>Ceiling of natriuresis</b>' + esc(dc.potency) + '</div></div>';

  if (dc.moa){
    h += '<h3 class="subh">Mechanism of action</h3><div class="moa">' +
         '<div><b>What it binds</b>' + esc(dc.moa.bind) + '</div>' +
         '<div><b>What that does to the protein</b>' + esc(dc.moa.consequence) + '</div>' +
         '<div><b>Pharmacokinetics that change management</b>' + esc(dc.moa.pk) + '</div>' +
         '<div class="wide"><b>Therefore</b>' + esc(dc.moa.why) + '</div></div>';
  }

  h += '<h3 class="subh">From the protein to the patient</h3><div class="casc">';
  (dc.cascade || []).forEach(function(s){
    h += '<div class="cstep"><div class="czone">' + esc(s.zone) + '</div>' +
         '<div class="crail"><i class="cdot z-' + esc(s.zone) + '"></i></div>' +
         '<div class="ctext">' + esc(s.text) + '</div></div>';
  });
  h += '</div>';

  h += '<div class="sig">' +
       '<div><h3 class="subh" style="margin-top:10px">What the blood does</h3>' + sigList(dc.serum) + '</div>' +
       '<div><h3 class="subh" style="margin-top:10px">What the urine does</h3>' + sigList(dc.urine) + '</div></div>';

  h += '<div class="duo">' +
       '<div><h3 class="subh">Why you would give it</h3>' + dlist(dc.uses) + '</div>' +
       '<div><h3 class="subh">What goes wrong, and why</h3><ul class="dlist">' +
       (dc.adverse || []).map(function(u){
         return '<li><b>' + esc(u.n) + '</b>' +
                (u.sev ? '<span class="sev sev-' + esc(u.sev) + '">' + esc(u.sev) + '</span>' : '') +
                '<br /><span>' + esc(u.why) + '</span></li>';
       }).join('') + '</ul></div></div>';

  if (dc.correlates && dc.correlates.length){
    h += '<h3 class="subh">Clinical correlates &mdash; the named conditions tied to this class</h3>' +
         '<div class="tablewrap"><table class="grid"><thead><tr>' +
         '<th style="width:88px">Relation</th><th style="width:220px">Condition</th>' +
         '<th>The mechanistic link</th></tr></thead><tbody>';
    /* grouped so "treats" reads first and "causes" sits with it for contrast;
       any kind outside the list still gets printed rather than silently dropped */
    var known = ['treats','causes','mimics','unmasks','interacts'];
    var order = known.concat(dc.correlates.map(function(c){ return c.kind; })
                              .filter(function(k){ return known.indexOf(k) < 0; }));
    order.filter(function(k, i){ return order.indexOf(k) === i; }).forEach(function(kind){
      dc.correlates.filter(function(c){ return c.kind === kind; }).forEach(function(c){
        h += '<tr><td><span class="kind k-' + esc(kind) + '">' + esc(kind) + '</span></td>' +
             '<td><b>' + esc(c.n) + '</b></td><td>' + esc(c.why) + '</td></tr>';
      });
    });
    h += '</tbody></table></div>';
  }

  h += '<h3 class="subh">How it is told apart from the other classes</h3>' + dlist(dc.contrast);
  if (dc.genetic) h += '<div class="callout"><span class="lbl">Genetic phenocopy</span>' + esc(dc.genetic) + '</div>';
  if (dc.hook)    h += '<div class="callout"><span class="lbl">Hook</span>' + esc(dc.hook) + '</div>';
  return h + '</div></div>';
}

/* What the selected agent does to the force the paracellular lane runs on.
   Drivers are named, not indexed, so inserting a transporter row cannot silently
   mis-wire this. `max` caps how far the lane can be pushed: abolishing the TAL's
   voltage stops that route dead, whereas damping proximal solvent drag only
   slows it. */
function paraState(panel, A){
  var pd = panel.paraDriver;
  if (!A || !pd) return null;
  var st = null;
  var inv = pd.inverse || [];
  A.targets.forEach(function(tg){
    var direct = pd.by.indexOf(tg.t.name) >= 0;
    var flipped = inv.indexOf(tg.t.name) >= 0;
    if (!direct && !flipped) return;
    /* a sensor that inhibits the drivers moves the lane the opposite way to itself */
    var e = flipped ? (tg.mod.e === 'up' ? 'down' : tg.mod.e === 'down' ? 'up' : tg.mod.e) : tg.mod.e;
    if (e === 'down'){
      /* an inverted driver acts through a signalling cascade, never a clean block */
      var full = !flipped && strengthOf(tg.mod) === 'full' && pd.max === 'full';
      if (full) st = { e:'down', strength:'full' };
      else if (!st || st.e !== 'down' || st.strength !== 'full') st = { e:'down', strength:'partial' };
    } else if (e === 'up' && !st){
      st = { e:'up', strength:'partial' };
    }
  });
  return st;
}

function renderPanel(panel, pid, sel){
  var ap = panel.apical || [], ba = panel.baso || [], pa = panel.para || [];
  var agents = panelAgents(panel);
  var A = (sel >= 0 && sel < agents.length) ? agents[sel] : null;

  var DC = drugOf(A);

  var rows = Math.max(ap.length, ba.length);
  var paraH = pa.length ? 80 : 14;
  var top = 44;
  var cellTop = top + paraH;
  var firstRow = cellTop + 42;
  var cellBottom = firstRow + (rows - 1) * ROW_H + 42;
  /* a drug gets an extra strip under the cell for the two band state readouts */
  var H = cellBottom + (DC ? 78 : 30);

  /* which rows the selected agent touches */
  var fxMap = {};
  if (A) A.targets.forEach(function(tg){
    fxMap[tg.side + ':' + tg.row] = { e:tg.mod.e, strength:strengthOf(tg.mod) };
  });

  /* second pass: a transporter the drug never binds can still fall silent because
     the one feeding it was blocked. Flagged dep:true so it is drawn as a knock-on
     rather than as a target. */
  var depNotes = [];
  if (A){
    [['apical', ap], ['baso', ba]].forEach(function(pair){
      pair[1].forEach(function(t, i){
        var key = pair[0] + ':' + i;
        if (!t.dependsOn || fxMap[key]) return;
        var hit = null;
        A.targets.forEach(function(tg){
          if (t.dependsOn.by.indexOf(tg.t.name) < 0 || tg.mod.e !== 'down') return;
          if (!hit || strengthOf(tg.mod) === 'full') hit = { src:tg.t.name, s:strengthOf(tg.mod) };
        });
        if (hit){
          fxMap[key] = { e:'down', strength:hit.s, dep:true };
          depNotes.push({ t:t, side:pair[0], src:hit.src, why:t.dependsOn.why });
        }
      });
    });
  }

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(panel.title) + '">';

  s += '<rect class="band-lumen" x="0" y="0" width="' + MEM_A + '" height="' + H + '" />';
  s += '<rect class="band-inter" x="' + MEM_B + '" y="0" width="' + (W - MEM_B) + '" height="' + H + '" />';
  s += '<rect class="band-junction" x="' + MEM_A + '" y="0" width="' + (MEM_B - MEM_A) + '" height="' + H + '" />';

  s += '<text class="bandlbl l" x="14" y="20">LUMEN</text>' +
       '<text class="bandsub l" x="14" y="35">urine side — filtrate flowing past</text>';
  s += '<text class="bandlbl i" x="' + (W - 14) + '" y="20" text-anchor="end">INTERSTITIUM</text>' +
       '<text class="bandsub i" x="' + (W - 14) + '" y="35" text-anchor="end">blood side — peritubular capillary</text>';

  /* paracellular lane — it has no transporter of its own, so it answers to
     whatever the drug did to the transporters that build its driving force */
  var paraFx = paraState(panel, A);
  var pDead    = !!(paraFx && paraFx.e === 'down' && paraFx.strength === 'full');
  var pSlowed  = !!(paraFx && paraFx.e === 'down' && !pDead);
  var pBoosted = !!(paraFx && paraFx.e === 'up');

  var paraDots = '';
  if (pa.length){
    s += '<text class="tinylbl" x="' + (MEM_A + 8) + '" y="' + (top + 10) + '">paracellular — between the cells, through the tight junction</text>';
    if (paraFx){
      var pc = pBoosted ? 'var(--up)' : 'var(--down)';
      s += '<text class="fxbadge" x="' + (INT_TIP + 40) + '" y="' + (top + 10) + '" text-anchor="end" fill="' + pc + '">' +
           (pBoosted ? '▲ STRONGER PULL' : pDead ? '✕ DRIVING FORCE GONE' : '▼ WEAKER PULL') + '</text>';
    }
    var laneY = top + 38;
    var half = Math.ceil(pa.length / 2);
    pa.forEach(function(f, i){
      var yy = laneY + (i < half ? 0 : 26);
      var slot = i < half ? i : i - half;
      var wide = (INT_TIP - LUM_TIP + 60);
      var segw = wide / half;
      var x1 = LUM_TIP - 30 + slot * segw;
      var x2 = x1 + segw - 26;
      var c = ionVar(f.ion);
      if (f.dir === 'out'){ var tmp = x1; x1 = x2; x2 = tmp; }
      s += arrow(x1, x2, yy, c, { dash:pDead, op: pDead ? 0.28 : 1, w: pBoosted ? 3.2 : 1.7 });
      s += '<text class="ionlbl" x="' + ((x1 + x2)/2) + '" y="' + (yy - 7) + '" text-anchor="middle" fill="' + c + '"' +
           (pDead ? ' opacity="0.4"' : '') + '>' + esc(f.ion) + '</text>';
      if (!pDead){
        paraDots += particles(x1, x2, yy, f.ion,
                              pBoosted ? 1.5 : pSlowed ? 6.4 : 3.1,
                              pBoosted ? 3   : pSlowed ? 1   : 2);
      }
    });
  }

  /* cell body */
  s += '<rect class="cellbody" x="' + MEM_A + '" y="' + cellTop + '" width="' + (MEM_B - MEM_A) +
       '" height="' + (cellBottom - cellTop) + '" rx="14" />';
  s += '<line class="membrane" x1="' + MEM_A + '" y1="' + cellTop + '" x2="' + MEM_A + '" y2="' + cellBottom + '" />';
  s += '<line class="membrane" x1="' + MEM_B + '" y1="' + cellTop + '" x2="' + MEM_B + '" y2="' + cellBottom + '" />';
  s += '<text class="tinylbl" x="' + (MEM_A + 8) + '" y="' + (cellTop + 16) + '" fill="var(--lumen-ink)">APICAL (luminal) membrane</text>';
  s += '<text class="tinylbl" x="' + (MEM_B - 8) + '" y="' + (cellTop + 16) + '" text-anchor="end" fill="var(--inter-ink)">BASOLATERAL membrane</text>';

  /* ONE agent at a time: a single chip and a clean connector per target */
  if (A){
    var lumenSide = A.side === 'lumen';
    /* The chip sits in the clear strip at the top of its band. Parking it beside
       its target row instead would drop it straight onto the ion labels. */
    var cy = 64;
    var lbl = A.name;
    var sub = (A.kind === 'drug' ? 'drug' : 'hormone / signal') + ' · acts from the ' + (lumenSide ? 'lumen' : 'blood');
    /* the name is 13px bold and the subtitle 9.5px — size for each separately */
    var cw = Math.min(262, Math.max(22 + lbl.length * 7.3, 22 + sub.length * 5.5));
    var cx0 = lumenSide ? 12 : (W - 12 - cw);
    var edge = lumenSide ? cx0 + cw : cx0;
    var tone = agentTone(A);
    var tcol = tone === 'up' ? 'var(--up)' : tone === 'down' ? 'var(--down)' : 'var(--accent)';

    A.targets.forEach(function(tg){
      var rowY = firstRow + tg.row * ROW_H;
      var targetX = tg.side === 'apical' ? MEM_A : MEM_B;
      var col = tg.mod.e === 'up' ? 'var(--up)' : 'var(--down)';
      /* land on the upper corner of the highlight box, not on the row itself —
         a horizontal approach would sit right on top of the flux arrow */
      var nf = Math.max(1, (tg.t.flux || []).length);
      var th = Math.max(30, nf*17 + 16);
      var capY = rowY - th/2 - 4;
      var appr = lumenSide ? targetX - 40 : targetX + 40;
      var c1 = edge + (lumenSide ? 46 : -46);
      var c2 = appr + (lumenSide ? -46 : 46);
      var d = 'M' + edge + ',' + cy + ' C' + c1 + ',' + cy + ' ' + c2 + ',' + capY + ' ' + appr + ',' + capY;
      s += '<path class="conn" d="' + d + '" stroke="' + col + '" />';
      var sgn = lumenSide ? 1 : -1;
      if (tg.mod.e === 'down'){
        s += '<line x1="' + appr + '" y1="' + (capY - 8) + '" x2="' + appr + '" y2="' + (capY + 8) +
             '" stroke="' + col + '" stroke-width="3.2" stroke-linecap="round" />';
      } else {
        s += '<path d="M' + (appr + 7*sgn) + ',' + capY + ' L' + (appr - 4*sgn) + ',' + (capY - 5.6) +
             ' L' + (appr - 4*sgn) + ',' + (capY + 5.6) + ' Z" fill="' + col + '" />';
      }
    });

    s += '<rect x="' + cx0 + '" y="' + (cy - 17) + '" width="' + cw + '" height="34" rx="9" ' +
         'fill="var(--surface)" stroke="' + tcol + '" stroke-width="2" />';
    s += '<text class="agentname" x="' + (cx0 + cw/2) + '" y="' + (cy - 2) + '" text-anchor="middle" fill="' + tcol + '">' + esc(lbl) + '</text>';
    s += '<text class="agentsub" x="' + (cx0 + cw/2) + '" y="' + (cy + 10) + '" text-anchor="middle">' + esc(sub) + '</text>';
  }

  /* transporter rows */
  var body = '', dots = paraDots;
  [['apical', ap], ['baso', ba]].forEach(function(pair){
    var side = pair[0];
    pair[1].forEach(function(t, i){
      var fx = fxMap[side + ':' + i] || null;
      var r = renderT(t, side, firstRow + i * ROW_H, fx, !!(A && !fx));
      body += r.svg; dots += r.dots;
    });
  });
  s += body + dots;

  /* the two bands now report their NEW steady state — this is the part of the
     drug's effect that lives in the fluid, not in any one transporter */
  if (DC){
    var sy = cellBottom + 24, bw = W/2 - 16;
    var strip = function(x, fill, edge, cls, lbl, txt){
      return '<rect x="' + x + '" y="' + sy + '" width="' + bw + '" height="42" rx="9" fill="' + fill +
             '" stroke="' + edge + '" stroke-width="1.5" />' +
             '<text class="statelbl" x="' + (x + 13) + '" y="' + (sy + 17) + '" fill="' + edge + '">' + lbl + '</text>' +
             '<text class="bandsub ' + cls + '" x="' + (x + 13) + '" y="' + (sy + 33) + '">' + esc(txt) + '</text>';
    };
    s += strip(10, 'var(--lumen)', 'var(--lumen-ink)', 'l',
               'LUMEN NOW · ' + esc(A.name).toUpperCase(), DC.lumenFx);
    s += strip(W/2 + 6, 'var(--inter)', 'var(--inter-ink)', 'i',
               'BLOOD SIDE NOW', DC.interFx);
  }
  s += '</svg>';

  /* ---------- controls ---------- */
  var html = '<div class="svgwrap">' + s + '</div>';
  var hor = [], dru = [];
  agents.forEach(function(a, i){ (a.kind === 'drug' ? dru : hor).push({ a:a, i:i }); });

  var btnRow = function(label, list){
    if (!list.length) return '';
    var r = '<div class="modrow"><span class="modlab">' + label + '</span>';
    list.forEach(function(o){
      var on = sel === o.i;
      r += '<button class="modbtn ' + agentTone(o.a) + (on ? ' on' : '') + '" onclick="pickMod(\'' + pid + '\',' + o.i + ')">' +
           esc(o.a.name) + '</button>';
    });
    return r + '</div>';
  };
  html += '<div class="modbar">' + btnRow('Hormones', hor) + btnRow('Drugs', dru);
  html += '<div class="modrow"><span class="modlab"></span><button class="modbtn" onclick="pickMod(\'' + pid + '\',-1)">' +
          (A ? '✕ Clear — back to resting state' : 'Resting state (nothing selected)') + '</button></div></div>';

  /* ---------- effect readout ---------- */
  if (A){
    html += '<div class="fxbox">';
    html += '<div class="fxhead"><b>' + esc(A.name) + '</b> — ' + A.targets.length +
            (A.targets.length === 1 ? ' target in this cell' : ' targets in this cell') + '</div>';
    A.targets.forEach(function(tg){
      var m = tg.mod, up = m.e === 'up';
      html += '<div class="fxrow">' +
              '<span class="fxt" style="color:' + (up ? 'var(--up)' : 'var(--down)') + '">' +
              (up ? '▲' : strengthOf(m) === 'full' ? '✕' : '▼') + ' ' + esc(tg.t.name) + '</span> ' +
              '<span class="fxside">' + tg.side + '</span>' +
              '<div class="fxchain">' + esc(m.chain || ((up ? 'Stimulates ' : 'Inhibits ') + tg.t.name +
                 (m.via ? ' (' + m.via + ')' : ''))) + '</div>' +
              (m.result ? '<div class="fxres">&rArr; ' + esc(m.result) + '</div>' : '') +
              '</div>';
    });
    depNotes.forEach(function(d){
      html += '<div class="fxrow">' +
              '<span class="fxt" style="color:var(--faint)">↳ ' + esc(d.t.name) + '</span> ' +
              '<span class="fxside">' + d.side + ' · knock-on, not a target</span>' +
              '<div class="fxchain">Nothing binds ' + esc(d.t.name) + ' — but ' + esc(d.src) +
              ' was blocked, and ' + esc(d.why) + '</div></div>';
    });
    html += '</div>';
    if (DC) html += renderDrugCard(DC);
  } else {
    html += '<div class="fxbox"><div class="fxhint">This is the cell at rest. Tap a hormone or drug above and the diagram will show you exactly which transporters it touches — blocked ones stop moving ions, stimulated ones speed up.</div></div>';
  }

  if (panel.paraNote){
    html += '<div class="callout"><span class="lbl">Paracellular route</span>' + esc(panel.paraNote);
    if (paraFx && panel.paraDriver){
      html += '<div style="margin-top:7px; font-weight:600; color:' +
              (pBoosted ? 'var(--up)' : 'var(--down)') + '">Under ' + esc(A.name) + ': ' +
              esc(panel.paraDriver.why) + '</div>';
    }
    html += '</div>';
  }

  /* ---------- always-visible reference tables ---------- */
  if (ap.concat(ba).some(function(t){ return t.note; })){
    html += '<h3 class="subh">What each transporter does</h3><div class="tablewrap"><table class="grid">' +
            '<thead><tr><th style="width:170px">Transporter</th><th>Function</th></tr></thead><tbody>';
    ap.forEach(function(t){ if (t.note) html += noteRow(t, 'apical'); });
    ba.forEach(function(t){ if (t.note) html += noteRow(t, 'basolateral'); });
    html += '</tbody></table></div>';
  }
  if (agents.length){
    html += '<h3 class="subh">Regulation of this cell</h3><div class="tablewrap"><table class="grid">' +
            '<thead><tr><th style="width:150px">Agent</th><th style="width:120px">Acts on</th><th style="width:70px">Effect</th><th>What happens</th></tr></thead><tbody>';
    agents.forEach(function(a, i){
      a.targets.forEach(function(tg, j){
        var m = tg.mod, up = m.e === 'up';
        html += '<tr>' +
          (j === 0 ? '<td rowspan="' + a.targets.length + '"><b>' + esc(a.name) + '</b><br />' +
                     '<span style="color:var(--muted); font-size:11.5px">' + (a.kind === 'drug' ? 'drug' : 'hormone') +
                     ' · from the ' + (a.side === 'lumen' ? 'lumen' : 'blood') + '</span><br />' +
                     '<button class="minibtn" onclick="pickMod(\'' + pid + '\',' + i + ')">show on diagram</button></td>' : '') +
          '<td>' + esc(tg.t.name) + '<br /><span style="color:var(--muted); font-size:11.5px">' + tg.side + '</span></td>' +
          '<td class="' + (up ? 'up' : 'down') + '">' + (up ? '▲ more' : strengthOf(m) === 'full' ? '✕ blocked' : '▼ less') + '</td>' +
          '<td>' + esc(m.chain || ((up ? 'stimulates' : 'inhibits') + (m.via ? ' — ' + m.via : ''))) +
            (m.result ? '<br /><span style="color:var(--muted)">&rArr; ' + esc(m.result) + '</span>' : '') + '</td></tr>';
      });
    });
    html += '</tbody></table></div>';
  }
  return html;
}

function noteRow(t, side){
  var flux = t.flux.map(function(f){
    return '<span style="color:' + ionVar(f.ion) + '; font-weight:700">' + esc((f.n || '') + f.ion) + '</span> ' + dirWord(f.dir, side);
  }).join(' &middot; ');
  return '<tr><td><b>' + esc(t.name) + '</b><br /><span style="color:var(--muted); font-size:11.5px">' +
         side + '</span></td>' +
         '<td>' + (flux ? '<div style="margin-bottom:3px">' + flux + '</div>' : '') + esc(t.note) + '</td></tr>';
}
function dirWord(dir, side){
  if (side === 'apical')  return dir === 'in' ? '<span style="color:var(--muted)">lumen&rarr;cell</span>' : '<span style="color:var(--muted)">cell&rarr;lumen</span>';
  if (side === 'basolateral') return dir === 'in' ? '<span style="color:var(--muted)">blood&rarr;cell</span>' : '<span style="color:var(--muted)">cell&rarr;blood</span>';
  return '';
}

];

/* The six tubule segments are drawn nose-to-tail, so dropping each following
   moveto splices them into one continuous path for the flow dots to ride. */
function tubePath(){
  return MAP_SEGS.map(function(m, i){
    return i === 0 ? m.d : m.d.replace(/^M[-\d.\s,]+/, ' ');
  }).join('');
}

function renderOverview(){

  s += '<text class="tinylbl" x="' + (MW-96) + '" y="' + (H-40) + '">mOsm/kg</text>';

       '<text class="tinylbl" x="104" y="128" text-anchor="middle">filters 180 L/day</text></g>';

  /* tubule segments */
  MAP_SEGS.forEach(function(m){
    var c = 'var(' + m.color + ')';
    s += '<g style="cursor:pointer" onclick="go(\'' + m.id + '\')">' +

  /* flow dots riding the whole tubule, coils and all */
  var tube = tubePath();
  for (var i = 0; i < 5; i++){

  }

  /* percentage badges */

  s += '</svg>';

}

function renderBars(){
  var sub = SUBSTANCES[state.sub];
  if (!sub.bars) return '';
  var order = [['pct','PCT','--na'],['tdl','Thin desc','--h2o'],['tal','TAL','--k'],['dct','DCT','--ca'],['cd','CD','--po4'],['ex','Excreted','--faint']];
  var html = '<div style="display:flex; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--line); margin-top:6px">';
  order.forEach(function(o){
    var v = sub.bars[o[0]] || 0;
    if (v === 0) return;
    var neg = v < 0;
    var av = Math.abs(v);
    var bg = o[0] === 'ex' ? 'var(--surface2)' : (neg ? 'var(--down)' : 'var(' + o[2] + ')');
    var fg = o[0] === 'ex' ? 'var(--muted)' : '#fff';
    html += '<div style="flex:' + av + '; background:' + bg + '; color:' + fg +
            '; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; overflow:hidden; white-space:nowrap"' +
            ' title="' + o[1] + ': ' + (neg ? 'secretes ' : '') + av + '%">' +
            (av >= 6 ? esc(o[1]) + ' ' + (neg ? '+' : '') + av + '%' : '') + '</div>';
  });
  html += '</div>';
  html += '<div style="font-size:11.5px; color:var(--muted); margin-top:5px">' +
          'Percentages of the FILTERED load. A red block means the segment <b>secretes</b> rather than reabsorbs.</div>';
  return html;
}

       '<div class="legend" style="font-size:13px; color:var(--ink)">' +
       '<span><i class="swatch" style="background:var(--lumen)"></i> <b>LUMEN</b> = urine side (apical/luminal membrane faces it)</span>' +
       '<span><i class="swatch" style="background:var(--cell)"></i> tubular cell</span>' +
       '<span><i class="swatch" style="background:var(--inter)"></i> <b>INTERSTITIUM</b> = blood side (basolateral membrane faces it)</span></div>' +
       '<table class="grid" style="margin-top:12px"><tbody>' +
       '<tr><td style="width:190px"><b>Reabsorption</b></td><td>lumen &rarr; cell (apical) &rarr; blood (basolateral). Two steps, two different transporters.</td></tr>' +
       '<tr><td><b>Secretion</b></td><td>blood &rarr; cell (basolateral) &rarr; lumen (apical). Same two steps, reversed.</td></tr>' +
       '<tr><td><b>Icon shapes</b></td><td>Circle with ATP = primary active pump &middot; rounded box = carrier (cotransporter or exchanger) &middot; split posts = ion channel &middot; hexagon = enzyme &middot; dome = receptor/sensor.</td></tr>' +
       '<tr><td><b>Green arrow →</b></td><td><span class="up">stimulates</span> that transporter.</td></tr>' +
       '<tr><td><b>Red bar ⊣</b></td><td><span class="down">inhibits</span> that transporter.</td></tr>' +
       '<tr><td><b>Chip on the left</b></td><td>acts from the <b>lumen</b> — most diuretics, which must be secreted into the tubule by the PCT first.</td></tr>' +
       '<tr><td><b>Chip on the right</b></td><td>acts from the <b>blood</b> — hormones and receptor blockers.</td></tr>' +
       '<tr><td><b>Picking an agent</b></td><td>The diagram switches to that agent&rsquo;s steady state: a blocked flux ' +
       'goes dashed and its ions stop moving, a stimulated one speeds up and crowds, a damped one slows to a ' +
       'trickle, and the two bands under the cell report what the lumen and the blood side are now doing. For the ' +
       'five diuretic classes your pharmacology lectures cover, the whole downstream chain opens underneath &mdash; ' +
       'or start from the <b>Diuretics</b> tab.</td></tr>' +
       '</tbody></table></div>';

  /* concentrating mechanism */
  h += '<div class="card"><h2>The countercurrent system in four sentences</h2><ul class="pearls">' +
       ['The <b>TAL</b> pumps NaCl out without water, making the interstitium salty and the tubular fluid dilute — this is the single ingredient that generates the gradient.',

        'The <b>vasa recta</b> dip in and out alongside the loop, picking up the reabsorbed water without washing the salt away — the "exchanger" step.',
        '<b>Urea</b>, recycled from the inner medullary collecting duct back into the thin limbs, supplies roughly half the medullary osmolality — which is why concentrating ability needs dietary protein and needs ADH.'
       ].map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul></div>';
  return h;
}

/* at = the point(s) on the tubule the class acts on; lab = where its caption
   sits; side decides which way the connector curves out of the label. */
var DRUG_PINS = [
  { k:'ca',    at:[[196,90]],            lab:[30,180],  side:'left'  },
  { k:'osm',   at:[[300,116],[318,330]], lab:[30,292],  side:'left'  },
  { k:'loop',  at:[[402,250]],           lab:[870,212], side:'right' },
  { k:'thz',   at:[[500,86]],            lab:[870,100], side:'right' },
  { k:'ksp',   at:[[616,372]],           lab:[870,372], side:'right' }
];

/* The lecture-grounded "examples" strings carry the lecturer's own annotations,
   which is right in the card but far too long for a map pin or a table cell.
   Pull just the first agent out of one. */
function leadDrug(dc){
  var s = String(dc.examples || '').replace(/\([^)]*\)/g, ' ');
  s = s.split(/[;,]/)[0];
  if (s.indexOf(':') >= 0) s = s.split(':').pop();
  s = s.replace(/\s+[-–—].*$/, '').replace(/\s+/g, ' ').trim();
  return s.length > 26 ? s.slice(0, 25).trim() + '…' : s;
}

function renderDrugMap(){
  var H = 600, MW = 900;
  var s = '<svg viewBox="0 0 ' + MW + ' ' + H + '" role="img" aria-label="Where each diuretic class acts">';

  s += '<defs><linearGradient id="dmedgrad" x1="0" y1="0" x2="0" y2="1">' +
       '<stop offset="0%" stop-color="var(--inter)" stop-opacity="0.25" />' +

  /* glomerulus + tubule, same geometry as the overview map */

       '<circle cx="104" cy="80" r="16" fill="var(--h)" opacity="0.35" />';
  MAP_SEGS.forEach(function(m){
    s += '<g style="cursor:pointer" onclick="go(\'' + m.id + '\')">' +

         'stroke-linecap="round" opacity="0.45" class="tubeflow" /></g>';
  });
  s += '<circle cx="402" cy="126" r="5" fill="var(--accent)" />' +
       '<text class="tinylbl" x="392" y="112" text-anchor="end">macula densa</text>';

  /* one labelled pin per drug class */
  DRUG_PINS.forEach(function(pin, i){
    var dc = DRUGS[pin.k];
    if (!dc) return;
    var right = pin.side === 'right';
    var lx = pin.lab[0], ly = pin.lab[1];
    var edge = lx, num = String(i + 1);

    pin.at.forEach(function(a){
      var px = a[0], py = a[1];
      var appr = px + (right ? 26 : -26);
      var c1 = edge + (right ? -70 : 70);
      var c2 = appr + (right ? 70 : -70);
      s += '<path class="conn" d="M' + edge + ',' + ly + ' C' + c1 + ',' + ly + ' ' +
           c2 + ',' + py + ' ' + appr + ',' + py + '" stroke="var(--accent)" ' +
           'stroke-width="1.8" opacity="0.55" />';
      s += '<circle cx="' + px + '" cy="' + py + '" r="13" fill="var(--accent)" ' +
           'stroke="var(--surface)" stroke-width="2.5" />' +
           '<text x="' + px + '" y="' + (py + 4.4) + '" text-anchor="middle" ' +
           'style="font-size:12px; font-weight:800; fill:#fff">' + num + '</text>';
    });

    var ta = right ? 'end' : 'start';
    s += '<text x="' + lx + '" y="' + ly + '" text-anchor="' + ta + '" ' +
         'style="font-size:13px; font-weight:800; fill:var(--ink)">' + num + '. ' + esc(dc.shortName) + '</text>';
    s += '<text class="tinylbl" x="' + lx + '" y="' + (ly + 15) + '" text-anchor="' + ta + '">' +
         esc(dc.targetShort) + ' \u00b7 ' + esc(dc.segLabel) + '</text>';
    s += '<text class="tinylbl" x="' + lx + '" y="' + (ly + 29) + '" text-anchor="' + ta + '">' +
         esc(leadDrug(dc)) + '</text>';
  });

  return s + '</svg>';
}

/* jump to the segment a drug acts on AND pre-select it there */
function goDrug(k){
  var dc = DRUGS[k];
  if (!dc) return;
  var idx = SEGMENTS.map(function(s){ return s.id; }).indexOf(dc.segId);
  if (idx < 0) return;
  var seg = SEGMENTS[idx];
  (seg.panels || []).forEach(function(p, pi){
    var pid = seg.id + '-p' + pi, picked = -1;
    /* first match wins: panelAgents walks apical rows first, so this lands on the
       class's primary block (NCC, not the secondary TRPM6 effect of chronic use) */
    panelAgents(p).forEach(function(a, ai){
      if (picked < 0 && a.kind === 'drug' && agentClass(a) === k) picked = ai;
    });
    if (picked >= 0) modSel[pid] = picked;
  });
  setTab(idx + 2); /* +1 for Overview, +1 for the Diuretics tab */
}
window.goDrug = goDrug;
